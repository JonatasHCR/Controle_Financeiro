# Controle Financeiro — o sexto stack da plataforma. Só lê: receita e despesa chegam pela
# sincronização com o Gerenciamento de Receita e o Controle de Despesa.
# Projeto Compose separado; a ordem de subida quem coordena é o stack.ps1.
name: controle_financeiro

x-ambiente-app: &ambiente-app
  TZ: America/Sao_Paulo
  APP_CONFIG: ${APP_CONFIG:-prod}
  FLASK_APP: wsgi
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  DB_HOST: db
  DB_PORT: 5432
  OIDC_ISSUER: http://${HOST_IP:?defina HOST_IP no .env}:8080/realms/ufc
  OIDC_CLIENT_ID: controle-financeiro-web
  OIDC_CLIENT_SECRET: ${CONTROLE_FINANCEIRO_CLIENT_SECRET:?defina CONTROLE_FINANCEIRO_CLIENT_SECRET no .env}
  OIDC_REQUIRED_GROUP: ${OIDC_REQUIRED_GROUP:-/apps/controle-financeiro}
  SESSION_SECRET: ${CONTROLE_FINANCEIRO_SESSION_SECRET:?defina CONTROLE_FINANCEIRO_SESSION_SECRET no .env}
  ADMIN_MESTRE_EMAIL: ${ADMIN_MESTRE_EMAIL:-}
  BACKUP_DIR: /backups
  HOST_IP: ${HOST_IP}
  PORTA_PUBLICA: ${CONTROLE_FINANCEIRO_PORT:-3060}
  PORTAL_PORT: ${PORTAL_PORT:-3080}
  INVENTARIO_PORT: ${INVENTARIO_PORT:-3030}
  RECEITA_PORT: ${RECEITA_PORT:-3040}
  DESPESA_PORT: ${DESPESA_PORT:-3010}
  CONTROLE_DESPESA_PORT: ${CONTROLE_DESPESA_PORT:-3050}
  # Origens da sincronização: os outros sistemas pelo IP do host.
  RECEITA_API_URL: http://${HOST_IP}:${RECEITA_PORT:-3040}/api/v1
  RECEITA_API_TOKEN: ${RECEITA_API_TOKEN:-}
  CONTROLE_API_URL: http://${HOST_IP}:${CONTROLE_DESPESA_PORT:-3050}/api/v1
  CONTROLE_API_TOKEN: ${CONTROLE_API_TOKEN:-}
  SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
  BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}

services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    image: controle-financeiro-web:latest
    environment: *ambiente-app
    volumes:
      - ./backups:/backups
    ports:
      - "${CONTROLE_FINANCEIRO_PORT:-3060}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
      - public
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Sincronização em laço, como o sync do inventário. Espera o web saudável
  # para não rodar contra schema sem migração.
  sync:
    image: controle-financeiro-web:latest
    pull_policy: never
    environment: *ambiente-app
    command: ["/bin/sh", "-c", "while true; do flask sincronizar || echo 'sincronizacao falhou'; sleep $$((SYNC_INTERVAL_MINUTES * 60)); done"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - private
      - public
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "sed 's/\r//g' /backup.sh > /tmp/backup.sh && exec sh /tmp/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    restart: unless-stopped

networks:
  private:
  public:

volumes:
  postgres_data:
